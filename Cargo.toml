[workspace]
resolver = "2"
members = [
  "apps/standalone",
  "crates/agents",
  "crates/config",
  "crates/domain",
  "crates/execution",
  "crates/git",
  "crates/orchestration",
  "crates/persistence",
  "crates/policy",
  "crates/protocol",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
persistence = { path = "crates/persistence" }
git = { path = "crates/git" }
orchestration = { path = "crates/orchestration" }
execution = { path = "crates/execution" }
agents = { path = "crates/agents" }
policy = { path = "crates/policy" }
config = { path = "crates/config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
ts-rs = { version = "11", features = ["serde-compat", "uuid-impl"] }
