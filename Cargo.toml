[workspace]
resolver = "2"
members = [
  "apps/standalone",
  "crates/agents",
  "crates/config",
  "crates/control-plane",
  "crates/domain",
  "crates/execution",
  "crates/git",
  "crates/orchestration",
  "crates/persistence",
  "crates/policy",
  "crates/protocol",
  "crates/review",
  "crates/server",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
persistence = { path = "crates/persistence" }
git = { path = "crates/git" }
orchestration = { path = "crates/orchestration" }
execution = { path = "crates/execution" }
agents = { path = "crates/agents" }
policy = { path = "crates/policy" }
config = { path = "crates/config" }
control-plane = { path = "crates/control-plane" }
review = { path = "crates/review" }
server = { path = "crates/server" }
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
getrandom = "0.3"
argon2 = "0.5"
http = "1"
landlock = "0.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fs2 = "0.4"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ts-rs = { version = "11", features = ["serde-compat", "uuid-impl"] }
