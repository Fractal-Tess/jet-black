name: jet-black-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONVEX_POSTGRES_DB:-jet_black}
      POSTGRES_PASSWORD: ${CONVEX_POSTGRES_PASSWORD:?Set CONVEX_POSTGRES_PASSWORD}
      POSTGRES_USER: ${CONVEX_POSTGRES_USER:-convex}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - convex_postgres_data:/var/lib/postgresql/data

  convex:
    image: ghcr.io/get-convex/convex-backend:1bd6910bc0b4066a918809912670d42afc8fdfb0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://localhost:3211}
      DISABLE_BEACON: "true"
      DOCUMENT_RETENTION_DELAY: ${CONVEX_DOCUMENT_RETENTION_DELAY:-172800}
      DO_NOT_REQUIRE_SSL: ${CONVEX_DO_NOT_REQUIRE_SSL:-1}
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-jet-black}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?Set CONVEX_INSTANCE_SECRET}
      POSTGRES_URL: postgresql://${CONVEX_POSTGRES_USER:-convex}:${CONVEX_POSTGRES_PASSWORD:?Set CONVEX_POSTGRES_PASSWORD}@postgres:5432
      RUST_LOG: ${CONVEX_RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex_credentials:/convex/data

  convex-migrator:
    build:
      context: ..
      dockerfile: convex/Dockerfile
      target: migrator
    depends_on:
      convex:
        condition: service_healthy
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      CONVEX_INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-jet-black}
      CONVEX_INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?Set CONVEX_INSTANCE_SECRET}
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      convex-migrator:
        condition: service_completed_successfully
    environment:
      CONVEX_SITE_URL: http://convex:3211
      CONVEX_URL: http://convex:3210
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      PUBLIC_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000'); if (!response.ok) throw new Error(`status $${response.status}`)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  convex_credentials:
  convex_postgres_data:
