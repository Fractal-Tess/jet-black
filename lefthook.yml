pre-commit:
  jobs:
    - name: ultracite
      glob:
        - "convex/**/*.js"
        - "convex/**/*.jsx"
        - "convex/**/*.ts"
        - "convex/**/*.tsx"
        - "convex/**/*.json"
        - "convex/**/*.jsonc"
        - "convex/**/*.css"
      run: bun x ultracite fix {staged_files}
      stage_fixed: true
