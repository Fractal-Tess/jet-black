name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Bun checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck shared package
        working-directory: packages/shared
        run: bun x tsc --noEmit
      - name: Typecheck web app
        working-directory: apps/web
        run: bun run typecheck
      - name: Build Bun workspaces
        run: bun x turbo run build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect Rust workspace
        id: rust
        shell: bash
        run: test -f Cargo.toml && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.rust.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: clippy, rustfmt
      - if: steps.rust.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        if: steps.rust.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Rust formatting
        if: steps.rust.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Rust check
        if: steps.rust.outputs.present == 'true'
        run: cargo check --workspace --all-targets --locked
      - name: Rust tests
        if: steps.rust.outputs.present == 'true'
        run: cargo test --workspace --all-targets --locked
      - name: Check generated protocol types
        if: steps.rust.outputs.present == 'true'
        run: cargo run -p protocol --bin generate-types -- packages/shared/src/protocol.generated.ts && git diff --exit-code -- packages/shared/src/protocol.generated.ts
      - name: Rust clippy
        if: steps.rust.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: No Rust workspace
        if: steps.rust.outputs.present != 'true'
        run: echo "Cargo.toml is absent; Rust checks are not applicable."

  governance:
    name: Generated and provenance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate provenance register and clean-room rule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          register_path = Path("governance/provenance.json")
          rule_path = Path("governance/CLEAN_ROOM.md")
          register = json.loads(register_path.read_text(encoding="utf-8"))
          references = register.get("references", [])

          if not references:
              raise SystemExit("provenance register must contain references")

          names = [entry.get("name") for entry in references]
          if len(names) != len(set(names)):
              raise SystemExit("provenance reference names must be unique")

          required = {"name", "repository", "revision", "use", "implementation_rule"}
          for entry in references:
              missing = sorted(required - entry.keys())
              if missing:
                  raise SystemExit(f"{entry.get('name', '<unknown>')} is missing: {', '.join(missing)}")
              if len(entry["revision"]) != 40:
                  raise SystemExit(f"{entry['name']} revision must be a full Git commit SHA")

          if not register.get("adaptations"):
              raise SystemExit("provenance register must contain adaptations")
          if "Prefer copying or adapting" not in rule_path.read_text(encoding="utf-8"):
              raise SystemExit("reference reuse rule is missing")
          PY
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi
